{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Burger_Core_POS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-body-bg: #050505;
            --bs-body-color: #ffffff;
            --pos-surface-low: #1c1b1b;
            --pos-surface-variant: #353534;
            --pos-primary: #ff8a00;
            --pos-primary-hover: #ffb77f;

            font-family: 'Inter', sans-serif;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }

        .bg-surface-low {
            background-color: var(--pos-surface-low) !important;
        }

        .border-surface-variant {
            border-color: var(--pos-surface-variant) !important;
        }

        .text-primary-custom {
            color: var(--pos-primary) !important;
        }

        .btn-primary-custom {
            background-color: var(--pos-primary);
            color: #000000;
            font-weight: 700;
            border: none;
        }

        .btn-primary-custom:hover {
            background-color: var(--pos-primary-hover);
            color: #000000;
        }

        .min-h-touch {
            min-height: 48px;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="vh-100 overflow-hidden">
    {% block layout %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
