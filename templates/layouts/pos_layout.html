{% extends "base.html" %}

{% block layout %}
<div class="d-flex w-100 h-100">
    <main class="flex-grow-1 overflow-y-auto hide-scrollbar position-relative bg-body">
        <div class="sticky-top bg-surface-low px-4 py-3 border-bottom border-surface-variant d-flex justify-content-between align-items-center" style="z-index: 10;">
            <h1 class="font-display h3 uppercase tracking-wider mb-0 text-white">{% block header_title %}Menu{% endblock %}</h1>
            {% block header_actions %}{% endblock %}
        </div>
        
        <div class="p-4">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
{% endblock %}
