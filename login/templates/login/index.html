<form id="checkout-form" method="POST" action="/login/add_form/">
    {% csrf_token %}

    <div style="margin-bottom: 15px;">
        <label for="documentId">Document ID:</label>
        <input type="number" id="documentId" name="documentId" required>
        <button type="button" id="searchBtn">Search Database</button>
        <span id="searchStatus" style="margin-left: 10px; color: gray;"></span>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required disabled>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required disabled>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required disabled>
    </div>

    <button type="submit" id="submitBtn">Continue</button>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const searchBtn = document.getElementById("searchBtn");
        const docInput = document.getElementById("documentId");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phone");
        const statusText = document.getElementById("searchStatus");

        function setInputsDisabled(disabled) {
            nameInput.disabled = disabled;
            emailInput.disabled = disabled;
            phoneInput.disabled = disabled;
        }

        setInputsDisabled(true);

        searchBtn.addEventListener("click", function() {
            const documentId = docInput.value.trim();

            if (!documentId) {
                statusText.textContent = "Please enter a document ID.";
                statusText.style.color = "red";
                return;
            }

            // UI Feedback during search
            searchBtn.disabled = true;
            statusText.textContent = "Searching...";
            statusText.style.color = "blue";

            // Call the Django view we created
            fetch(`/login/find/${documentId}`)
                .then(response => {
                    if (response.status === 404) {
                        // User not found: Clear fields so they can enter manually
                        setInputsDisabled(false);
                        nameInput.value = "";
                        emailInput.value = "";
                        phoneInput.value = "";
                        statusText.textContent = "User not found. Please enter manually.";
                        statusText.style.color = "orange";
                        return null;
                    }
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    if (data && data.found) {
                        // User found: Auto-fill the fields
                        nameInput.value = data.name;
                        emailInput.value = data.email;
                        phoneInput.value = data.phone;
                        statusText.textContent = "User found and populated!";
                        statusText.style.color = "green";
                        setInputsDisabled(true);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    statusText.textContent = "Error connecting to server.";
                    statusText.style.color = "red";
                })
                .finally(() => {
                    // Re-enable the search button
                    searchBtn.disabled = false;
                });
        });
    });
</script>
